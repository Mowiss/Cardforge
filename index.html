<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#241c2e">
<title>Carte Forge — atelier de jeu de cartes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital@0;1&family=Grenze+Gotisch&display=swap" rel="stylesheet">
<style>
  :root{
    --shell:#241c2e; --panel:#2e2539; --panel-2:#392e46; --line:#4a3d59;
    --ink:#f3edf7; --muted:#a99bbd; --accent:#f0b942; --accent-ink:#3a2c08;
    --accent-soft:#4a3d1c; --lock:#b98cff; --danger:#e5686f; --ok:#6fce8f;
    --canvas:#173026;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--shell); color:var(--ink); font-size:14px; overflow:hidden;
  }
  button{font-family:inherit; cursor:pointer}
  input,select,textarea{font-family:inherit}

  /* ---------- Layout ---------- */
  .app{display:flex; flex-direction:column; height:100vh}
  header.bar{
    display:flex; align-items:center; gap:14px; padding:10px 16px;
    background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  .brand{display:flex; align-items:baseline; gap:8px; margin-right:6px}
  .brand b{font-family:"Cinzel",serif; font-size:18px; letter-spacing:.5px}
  .brand .logo{font-size:22px; line-height:1}
  .brand .tag{color:var(--muted); font-size:12px}
  .proj-name{
    background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    padding:7px 10px; border-radius:8px; width:190px; font-size:13px;
  }
  .tabs{display:flex; gap:4px; margin-left:6px}
  .tab{
    background:transparent; border:1px solid transparent; color:var(--muted);
    padding:8px 16px; border-radius:9px; font-size:13px; font-weight:600;
  }
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--panel-2); color:var(--ink); border-color:var(--line)}
  .spacer{flex:1}
  .btn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    padding:8px 13px; border-radius:8px; font-size:13px; display:inline-flex; align-items:center; gap:7px;
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700}
  .btn.ghost{background:transparent}
  .btn.danger:hover{border-color:var(--danger); color:var(--danger)}
  .btn.sm{padding:5px 9px; font-size:12px; border-radius:7px}

  main{flex:1; min-height:0; position:relative}
  .view{position:absolute; inset:0; display:none}
  .view.active{display:flex}

  /* ---------- Editor overlay (édition d'une carte) ---------- */
  .editor{position:fixed; inset:0; background:var(--shell); z-index:80; display:none; flex-direction:column}
  .editor.show{display:flex}
  .ed-bar{display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto}
  .ed-bar .spacer{flex:1}
  .ed-side{flex:0 0 auto}
  .ed-side button{padding:7px 16px}
  .ed-body{flex:1; min-height:0; position:relative}
  .ed-panel{position:absolute; inset:0; display:none}
  .ed-panel.active{display:flex}
  .zoomctl.hide{display:none}
  .layerctl{display:flex; gap:6px}
  .layerctl.hide{display:none}

  /* ---------- Editor 3 columns ---------- */
  .col-left,.col-right{
    width:270px; flex:0 0 auto; background:var(--panel); overflow-y:auto;
    border-right:1px solid var(--line);
  }
  .col-right{border-right:none; border-left:1px solid var(--line)}
  .canvas-wrap{flex:1; min-width:0; display:flex; flex-direction:column; background:var(--canvas)}
  .canvas-top{
    display:flex; align-items:center; gap:10px; padding:8px 14px;
    border-bottom:1px solid var(--line); background:rgba(0,0,0,.15); flex:0 0 auto;
  }
  .card-switcher{display:flex; align-items:center; gap:6px}
  .card-switcher select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    padding:6px 8px; border-radius:7px; max-width:220px;
  }
  .cardname{background:var(--panel-2); border:1px solid var(--line); color:var(--ink); padding:6px 8px; border-radius:7px; width:150px; font-size:13px}
  .cardname:focus{outline:none; border-color:var(--accent)}
  .zoomctl{margin-left:auto; display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px}
  .canvas{flex:1; min-height:0; overflow:auto; display:flex; align-items:center; justify-content:center; padding:30px;
    background:radial-gradient(ellipse at center, #1f4032 0%, #142720 68%, #0d1a15 100%)}

  .scalebox{position:relative}
  .stage{
    position:absolute; top:0; left:0; transform-origin:top left;
    background:#fff; box-shadow:0 12px 40px rgba(0,0,0,.5); overflow:hidden;
  }
  .stage .bg{position:absolute; inset:0; background-size:cover; background-position:center}
  .margin-guide{position:absolute; border:1px dashed rgba(120,120,140,.55); pointer-events:none; z-index:5}
  .cardframe{position:absolute; inset:0; box-sizing:border-box; pointer-events:none; z-index:6}
  .snapline{position:absolute; background:var(--accent); z-index:9; pointer-events:none; opacity:.8}

  .module{position:absolute; box-sizing:border-box; overflow:hidden; user-select:none}
  .module .content{width:100%; height:100%; display:flex; overflow:hidden; word-break:break-word}
  .module .content.img{background-position:center; background-repeat:no-repeat}
  .module .ph{width:100%;height:100%; display:flex; align-items:center; justify-content:center;
    color:#b7b1a3; font-size:12px; gap:6px; background:repeating-linear-gradient(45deg,#f2f0ea,#f2f0ea 8px,#eae7df 8px,#eae7df 16px)}
  .module.selected{outline:2px solid var(--accent); outline-offset:0}
  .module.locked{outline:2px dashed var(--lock)}
  .lockbadge{position:absolute; top:3px; right:3px; background:var(--lock); color:#20143a;
    font-size:10px; padding:1px 5px; border-radius:5px; z-index:3; pointer-events:none}
  .handle{position:absolute; width:11px; height:11px; background:#fff; border:2px solid var(--accent);
    border-radius:2px; z-index:20}
  .handle.nw{left:-6px;top:-6px;cursor:nwse-resize} .handle.ne{right:-6px;top:-6px;cursor:nesw-resize}
  .handle.sw{left:-6px;bottom:-6px;cursor:nesw-resize} .handle.se{right:-6px;bottom:-6px;cursor:nwse-resize}
  .handle.n{left:50%;top:-6px;margin-left:-5px;cursor:ns-resize} .handle.s{left:50%;bottom:-6px;margin-left:-5px;cursor:ns-resize}
  .handle.w{left:-6px;top:50%;margin-top:-5px;cursor:ew-resize} .handle.e{right:-6px;top:50%;margin-top:-5px;cursor:ew-resize}

  /* ---------- Panels ---------- */
  .sec{padding:14px; border-bottom:1px solid var(--line)}
  .sec h3{margin:0 0 10px; font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); font-weight:700}
  .addgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .add{
    background:var(--panel-2); border:1px solid var(--line); color:var(--ink); border-radius:9px;
    padding:12px 8px; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; text-align:center;
  }
  .add{transition:transform .12s ease, border-color .12s ease, color .12s ease}
  .add:hover{border-color:var(--accent); transform:translateY(-2px) rotate(-1.5deg); color:#fff}
  .add .g{font-size:22px}
  /* menu ⛯ */
  .menu-wrap{position:relative}
  .menu{position:absolute; right:0; top:calc(100% + 8px); background:var(--panel-2); border:1px solid var(--line);
    border-radius:11px; padding:6px; min-width:216px; box-shadow:0 16px 44px rgba(0,0,0,.55); z-index:60; display:none}
  .menu.show{display:block}
  .menu-item{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:transparent;
    border:none; color:var(--ink); padding:9px 10px; border-radius:8px; font-size:13px}
  .menu-item:hover{background:var(--accent-soft)}
  .menu-item:disabled{opacity:.4; cursor:default}
  .menu-sep{height:1px; background:var(--line); margin:5px 6px}
  .field{margin-bottom:10px}
  .field:last-child{margin-bottom:0}
  .field label{display:block; font-size:11px; color:var(--muted); margin-bottom:4px}
  .row{display:flex; gap:8px}
  .row>*{flex:1; min-width:0}
  input[type=text],input[type=number],select,textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    padding:7px 8px; border-radius:7px; font-size:13px;
  }
  textarea{resize:vertical; min-height:70px; line-height:1.35}
  input[type=range]{width:100%}
  input[type=color]{width:100%; height:32px; padding:2px; background:var(--panel-2); border:1px solid var(--line); border-radius:7px}
  .seg{display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden}
  .seg button{flex:1; background:var(--panel-2); border:none; color:var(--muted); padding:7px 0; font-size:13px}
  .seg button.on{background:var(--accent); color:var(--accent-ink); font-weight:700}
  .toggle{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .switch{width:40px;height:22px;border-radius:20px;background:var(--line); position:relative; transition:.15s; flex:0 0 auto; cursor:pointer}
  .switch.on{background:var(--accent)}
  .switch i{position:absolute; top:2px; left:2px; width:18px;height:18px;border-radius:50%; background:#fff; transition:.15s}
  .switch.on i{left:20px}
  .filebtn{position:relative; overflow:hidden}
  .filebtn input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer}
  .hint{color:var(--muted); font-size:12px; line-height:1.5}
  .empty-note{padding:30px 16px; color:var(--muted); font-size:13px; text-align:center; line-height:1.6}

  /* ---------- Verso ---------- */
  .verso-side{width:300px; flex:0 0 auto; background:var(--panel); border-left:1px solid var(--line); overflow-y:auto}

  /* ---------- Project view ---------- */
  .proj{flex:1; overflow-y:auto; padding:22px 26px}
  .proj-head{display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap}
  .proj-head h2{font-family:"Cinzel",serif; margin:0; font-size:22px}
  /* Paquets en piles */
  .deck-row{margin-bottom:14px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px}
  .deck-row.loose{background:transparent; border-style:dashed}
  .deck-row-head{display:flex; align-items:center; gap:10px; margin-bottom:2px}
  .deck-row-head .dot{width:13px;height:13px;border-radius:50%; box-shadow:0 0 0 2px rgba(0,0,0,.25); flex:0 0 auto}
  .deck-row-head .dname{font-family:"Cinzel",serif; font-size:16px}
  .deck-row-head .dcount{color:var(--muted); font-size:12px}
  .deck-row-head .dos-mini{width:26px;height:36px;border-radius:4px; background-size:cover; background-position:center; border:1px solid var(--line); background-color:#3a2f47; flex:0 0 auto}
  .deck-row-head .grow{flex:1}
  .deck-row-head .ic{background:var(--panel-2); border:1px solid var(--line); color:var(--muted); width:30px;height:30px;border-radius:8px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto}
  .deck-row-head .ic:hover{color:var(--ink); border-color:var(--accent)}
  .deck-row-head .ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .pile-scroll{overflow-x:auto; overflow-y:hidden; padding:16px 2px 4px}
  .pile{position:relative}
  .pile.empty{color:var(--muted); font-size:13px; padding:24px 6px; height:auto!important}
  .pile-card{position:absolute; top:34px; cursor:pointer;
    transform:translateY(var(--jit,0)) rotate(var(--rot,0deg)); transition:transform .2s ease}
  .pile-card:hover{z-index:500; transform:translateY(-30px) rotate(0deg) scale(1.06)}
  .pile-card .art{position:relative; border-radius:10px; overflow:hidden; background:#fff;
    box-shadow:0 6px 16px rgba(0,0,0,.45); transition:box-shadow .2s}
  .pile-card:hover .art{box-shadow:0 24px 50px rgba(0,0,0,.6)}
  .dos-card .art{box-shadow:0 6px 16px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.18)}
  .pile-card .art .stage{transform-origin:top left; position:relative}
  .pile-no{position:absolute; top:6px; left:6px; background:var(--accent); color:var(--accent-ink); font-size:11px; font-weight:700;
    min-width:20px; height:20px; padding:0 5px; border-radius:6px; display:none; align-items:center; justify-content:center; z-index:3}
  .pile-card:hover .pile-no{display:flex}
  .pile-name{position:absolute; left:50%; bottom:-6px; transform:translateX(-50%) translateY(100%); white-space:nowrap;
    background:var(--panel-2); border:1px solid var(--line); color:var(--ink); font-size:12px; padding:3px 9px; border-radius:8px;
    opacity:0; transition:opacity .2s; pointer-events:none}
  .pile-card:hover .pile-name{opacity:1}
  .card-tools{position:absolute; left:50%; top:-14px; transform:translateX(-50%); display:flex; gap:3px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:4px; box-shadow:0 10px 26px rgba(0,0,0,.5);
    opacity:0; visibility:hidden; transition:opacity .15s; z-index:6}
  .pile-card:hover .card-tools{opacity:1; visibility:visible}
  .card-tools button{width:28px;height:28px;border:none;background:transparent;color:var(--muted);border-radius:7px;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
  .card-tools button:hover{background:var(--accent-soft); color:#fff}
  .card-tools button.del:hover{background:rgba(229,104,111,.22); color:var(--danger)}
  .card-tools svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .floatmenu{position:fixed; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:6px;
    min-width:170px; box-shadow:0 16px 44px rgba(0,0,0,.55); z-index:300}
  .floatmenu button{display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:transparent; border:none;
    color:var(--ink); padding:8px 10px; border-radius:7px; font-size:13px; cursor:pointer}
  .floatmenu button:hover{background:var(--accent-soft)}
  .floatmenu button:disabled{opacity:.5;cursor:default}
  .floatmenu .dot{width:10px;height:10px;border-radius:50%; flex:0 0 auto}
  .dos-row{display:flex; align-items:stretch; gap:10px}
  .dos-prev{width:52px;height:72px;border-radius:6px;border:1px solid var(--line);background:#3a2f47;background-size:cover;background-position:center;flex:0 0 auto}
  .print-modal{width:780px; max-width:95vw}
  .print-grid{display:flex; gap:18px; align-items:stretch}
  .print-settings{width:300px; flex:0 0 auto}
  .print-preview-wrap{flex:1; min-width:0; display:flex; flex-direction:column; gap:8px}
  .pp-toolbar{display:flex; align-items:center; justify-content:center; gap:12px; color:var(--muted); font-size:12px}
  .pp-stage{flex:1; background:var(--canvas); border:1px solid var(--line); border-radius:10px; display:flex; align-items:center; justify-content:center; padding:14px; min-height:360px; overflow:auto}
  .pp-page{position:relative; background:#fff; box-shadow:0 8px 26px rgba(0,0,0,.45)}
  .pp-card{position:absolute; overflow:hidden; background:#fff}
  .pp-card .stage{transform-origin:top left; position:absolute; top:0; left:0}
  .pp-crop{position:absolute; background:#000}
  @media (max-width:720px){ .print-grid{flex-wrap:wrap} .print-settings{width:100%} }

  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:100}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; width:360px}
  .modal h3{margin:0 0 14px; font-family:"Cinzel",serif}
  .modal .actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel-2);
    border:1px solid var(--line); padding:10px 18px; border-radius:10px; z-index:200; opacity:0; transition:.25s; pointer-events:none}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion: reduce){ .add{transition:none} .add:hover{transform:none} }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span class="logo">🎴</span><b>Carte Forge</b><span class="tag">atelier de cartes</span></div>
    <input id="projName" class="proj-name" placeholder="Nom du projet">
    <div class="spacer"></div>
    <button class="btn ghost sm" id="printBtn">⎙ Print</button>
    <div class="menu-wrap">
      <button class="btn primary sm" id="gearBtn" title="Paramètre">⛯ Paramètre</button>
      <div class="menu" id="gearMenu">
        <button class="menu-item" id="mSave">💾 Sauver JSON</button>
        <button class="menu-item" id="mOpen">📂 Ouvrir JSON</button>
        <button class="menu-item" id="mPng">🖼️ Export PNG (carte)</button>
        <div class="menu-sep"></div>
        <button class="menu-item" id="mInstall">⬇️ Installer l'application</button>
      </div>
    </div>
    <input type="file" id="loadJson" accept=".json" hidden>
  </header>

  <main>
    <div id="editor" class="editor">
      <header class="ed-bar">
        <button class="btn sm" id="edBack">← Projet</button>
        <input type="text" id="cardName" class="cardname" placeholder="Nom de la carte">
        <div class="spacer"></div>
        <div class="layerctl" id="layerctl">
          <button class="btn sm" id="layerDown" title="Reculer le module sous les autres">▽ Calque ↓</button>
          <button class="btn sm" id="layerUp" title="Avancer le module au-dessus des autres">△ Calque ↑</button>
        </div>
      </header>
      <div class="ed-body">
        <div class="ed-panel recto active">
      <aside class="col-left">
        <div class="sec">
          <h3>Ajouter un module</h3>
          <div class="addgrid">
            <button class="add" data-add="title"><span class="g">🏷️</span>Cadre titre</button>
            <button class="add" data-add="icon"><span class="g">⬡</span>Icône</button>
            <button class="add" data-add="image"><span class="g">🖼️</span>Cadre image</button>
            <button class="add" data-add="description"><span class="g">📜</span>Description</button>
          </div>
        </div>
        <div class="sec">
          <h3>Bordure de la carte</h3>
          <div class="field"><label>Largeur : <span id="cbW">0</span> px</label><input type="range" id="cardBorderW" min="0" max="40" value="0"></div>
          <div class="field"><label>Couleur</label><input type="color" id="cardBorderColor" value="#241c2e"></div>
          <div class="field"><label>Coins arrondis : <span id="cbR">0</span> px</label><input type="range" id="cardRadius" min="0" max="120" value="0"></div>
        </div>
        <div class="sec">
          <h3>Fond de la carte</h3>
          <div class="field">
            <button class="btn filebtn" style="width:100%">Importer un fond<input type="file" id="bgFile" accept="image/*"></button>
          </div>
          <div class="row">
            <div class="field"><label>Couleur de fond</label><input type="color" id="bgColor" value="#ffffff"></div>
          </div>
          <button class="btn ghost sm danger" id="clearBg" style="width:100%">Retirer le fond image</button>
        </div>
        <div class="sec">
          <h3>Format</h3>
          <div class="field">
            <label>Format de carte</label>
            <select id="cardSize">
              <option value="504x704">Poker — 63×88 mm</option>
              <option value="456x704">Bridge — 57×88 mm</option>
              <option value="560x960">Tarot — 70×120 mm</option>
              <option value="560x560">Carré — 70×70 mm</option>
              <option value="360x544">Mini — 45×68 mm</option>
            </select>
          </div>
        </div>
      </aside>

      <div class="canvas-wrap">
        <div class="canvas" id="canvas">
          <div class="scalebox" id="scalebox"><div class="stage" id="stage"></div></div>
        </div>
      </div>

      <aside class="col-right" id="rightPanel"></aside>
        </div><!-- /recto panel -->

        <div class="ed-panel verso">
      <div class="canvas-wrap">
        <div class="canvas" id="canvasV">
          <div class="scalebox" id="scaleboxV"><div class="stage" id="stageV"></div></div>
        </div>
      </div>
      <aside class="verso-side" id="versoPanel"></aside>
        </div><!-- /verso panel -->
      </div><!-- /ed-body -->
    </div><!-- /editor -->

    <!-- ================= PROJET ================= -->
    <section class="view active" data-view="projet">
      <div class="proj">
        <div class="proj-head">
          <h2>Projet</h2>
          <span class="hint" id="cardCount"></span>
          <div class="spacer" style="flex:1"></div>
          <button class="btn sm" id="btnNewCard2">＋ Nouvelle carte</button>
          <button class="btn sm" id="btnNewDeck">＋ Paquet</button>
        </div>
        <div id="decksContainer"></div>
      </div>
    </section>
  </main>
</div>

<div class="modal-bg" id="deckModal">
  <div class="modal">
    <h3 id="deckModalTitle">Nouveau paquet</h3>
    <div class="field"><label>Nom du paquet</label><input type="text" id="deckNameInput" placeholder="ex. Sorts, Monstres, Objets…"></div>
    <div class="field"><label>Couleur du paquet</label><input type="color" id="deckColorInput" value="#f0b942"></div>
    <div class="field"><label>Dos (verso) du paquet</label>
      <div class="dos-row">
        <div class="dos-prev" id="deckDosPrev"></div>
        <div style="display:flex;flex-direction:column;gap:6px;flex:1;justify-content:center">
          <button class="btn sm filebtn" style="width:100%">Importer le dos<input type="file" id="deckDosFile" accept="image/*"></button>
          <button class="btn ghost sm" id="deckDosClear" style="width:100%">Retirer le dos</button>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost sm" id="deckCancel">Annuler</button>
      <button class="btn primary sm" id="deckSave">Enregistrer</button>
    </div>

</div>

<div class="modal-bg" id="askModal">

    <div class="field" id="askField" style="display:none"><input type="text" id="askInput"></div>

      <button class="btn ghost sm" id="askCancel">Annuler</button>
      <button class="btn primary sm" id="askOk">OK</button>

</div>

<div class="modal-bg" id="printModal">
  <div class="modal print-modal">
    <h3>Impression</h3>
    <div class="print-grid">
      <div class="print-settings">
        <div class="row">
          <div class="field"><label>Format de page</label>
            <select id="pgFormat"><option value="A4">A4 (210×297)</option><option value="Letter">Letter (216×279)</option></select>
          </div>
          <div class="field"><label>Orientation</label>
            <select id="pgOrient"><option value="portrait">Portrait</option><option value="landscape">Paysage</option></select>
          </div>
        </div>
        <div class="row">
          <div class="field"><label>Marge de page : <span id="pgMarginV">10</span> mm</label><input type="range" id="pgMargin" min="0" max="30" value="10"></div>
          <div class="field"><label>Espacement : <span id="pgGapV">3</span> mm</label><input type="range" id="pgGap" min="0" max="15" value="3"></div>
        </div>
        <div class="field"><label>Marge de sécurité (guide sur la carte) : <span id="marginVal">28</span> px</label>
          <input type="range" id="margin" min="0" max="120" value="28"></div>
        <div class="toggle" style="margin:6px 0 4px">
          <span class="hint">Repères de coupe (marqueurs d'impression)</span>
          <div class="switch on" id="cropSw"><i></i></div>
        </div>
        <p class="hint" id="printInfo" style="margin:8px 0 0"></p>
      </div>
      <div class="print-preview-wrap">
        <div class="pp-toolbar">
          <button class="btn sm" id="ppPrev">‹</button>
          <span>Page <span id="ppPage">1</span> / <span id="ppCount">1</span></span>
          <button class="btn sm" id="ppNext">›</button>
        </div>
        <div class="pp-stage" id="printPreview"></div>
      </div>

    <div class="actions">
      <button class="btn ghost sm" id="printCancel">Fermer</button>
      <button class="btn sm" id="printPNG">⎙ Print to PNG</button>
      <button class="btn primary sm" id="printPDF">⎙ Print to PDF</button>
    </div>
  </div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* =========================================================================
   Carte Forge — état + logique. Tout est mono-fichier, vanilla JS.
   Persistance : auto-save localStorage (si dispo) + export/import JSON.
   ========================================================================= */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const FONTS = [
  ["'Inter', system-ui, sans-serif","Inter (sans)"],
  ["'Cinzel', serif","Cinzel (titre)"],
  ["'EB Garamond', Garamond, serif","EB Garamond"],
  ["'Grenze Gotisch', cursive","Grenze Gotisch (gothique)"],
  ["Georgia, serif","Georgia"],
  ["'Times New Roman', serif","Times"],
  ["'Palatino Linotype', serif","Palatino"],
  ["'Trebuchet MS', sans-serif","Trebuchet"],
  ["Verdana, sans-serif","Verdana"],
  ["Impact, sans-serif","Impact"],
  ["'Courier New', monospace","Courier"],
];

/* ---------- État ---------- */
let project = null;
let ui = { editSide:'recto', cardId:null, sel:null, zoom:1, deckFilter:null, editingDeck:null, deckDos:null };

function blankCard(name){
  return { id:uid(), name:name||'Carte', deckId:null, bg:null, bgColor:'#ffffff',
           borderW:0, borderColor:'#241c2e', radius:0,
           modules:[], verso:{ image:null, useShared:true } };
}
function newProject(){
  project = { name:'Nouveau projet', card:{w:504,h:704}, margin:28,
              print:{ pageFormat:'A4', orient:'portrait', pageMargin:10, gap:3, cropMarks:true },
              sharedBack:null, decks:[], cards:[ blankCard('Carte 1') ] };
  ui.cardId = project.cards[0].id;
}
function ensurePrint(){ if(!project.print) project.print={ pageFormat:'A4', orient:'portrait', pageMargin:10, gap:3, cropMarks:true }; }
function pageDims(){ ensurePrint(); const P=project.print;
  let w=P.pageFormat==='Letter'?215.9:210, h=P.pageFormat==='Letter'?279.4:297;
  if(P.orient==='landscape'){ const t=w; w=h; h=t; } return {w,h}; }
function currentCard(){ return project.cards.find(c=>c.id===ui.cardId) || project.cards[0]; }
function selectedModule(){ const c=currentCard(); return c && c.modules.find(m=>m.id===ui.sel); }

/* ---------- Fabrique de module ---------- */
function makeModule(type){
  const W=project.card.w, H=project.card.h, M=project.margin;
  const base={ id:uid(), type, locked:false, x:M, y:M, w:200, h:80, z:Date.now(),
    bg:'transparent', radius:8, borderW:0, borderColor:'#333333', padding:10, opacity:1,
    text:'', fontFamily:FONTS[0][0], fontSize:22, color:'#1a1a1a', align:'center', valign:'center',
    bold:false, italic:false, lineHeight:1.2, image:null, fit:'cover' };
  if(type==='title')       Object.assign(base,{x:M,y:M,w:W-2*M,h:74,fontSize:30,bold:true,fontFamily:FONTS[1][0],text:'Titre de la carte',bg:'#f3ecda',borderW:1,borderColor:'#c7b485',radius:10});
  if(type==='icon')        Object.assign(base,{x:W-M-78,y:M,w:78,h:78,radius:60,bg:'#ffffff',borderW:2,borderColor:'#c7b485',padding:8});
  if(type==='image')       Object.assign(base,{x:M,y:M+92,w:W-2*M,h:Math.round(H*0.42),bg:'#ecebe6',radius:8,padding:0});
  if(type==='description') Object.assign(base,{x:M,y:H-M-176,w:W-2*M,h:166,fontSize:17,align:'left',valign:'top',text:'Description, effet ou règles de la carte…',bg:'#fbf9f3',borderW:1,borderColor:'#ddd6c4',radius:8,padding:12,lineHeight:1.35});
  return base;
}
const isText = m => m.type==='title' || m.type==='description';

/* =========================================================================
   RENDU DU STAGE (recto)
   ========================================================================= */
function styleModuleEl(el, m){
  el.style.left=m.x+'px'; el.style.top=m.y+'px'; el.style.width=m.w+'px'; el.style.height=m.h+'px';
  el.style.background=m.bg; el.style.borderRadius=m.radius+'px';
  el.style.border = m.borderW>0 ? `${m.borderW}px solid ${m.borderColor}` : 'none';
  el.style.opacity=m.opacity;
}
function contentEl(m){
  const c=document.createElement('div'); c.className='content';
  c.style.padding=m.padding+'px';
  if(isText(m)){
    c.style.alignItems = m.valign==='top'?'flex-start':m.valign==='bottom'?'flex-end':'center';
    c.style.justifyContent = m.align==='left'?'flex-start':m.align==='right'?'flex-end':'center';
    const t=document.createElement('div');
    t.style.width='100%'; t.style.textAlign=m.align; t.style.whiteSpace='pre-wrap';
    t.style.fontFamily=m.fontFamily; t.style.fontSize=m.fontSize+'px'; t.style.color=m.color;
    t.style.fontWeight=m.bold?'700':'400'; t.style.fontStyle=m.italic?'italic':'normal';
    t.style.lineHeight=m.lineHeight;
    t.textContent=m.text;
    t.dataset.text='1';
    c.appendChild(t);
  } else {
    if(m.image){
      c.classList.add('img');
      c.style.backgroundImage=`url(${m.image})`;
      c.style.backgroundSize = m.fit==='contain'?'contain':'cover';
    } else {
      const ph=document.createElement('div'); ph.className='ph';
      ph.textContent = m.type==='icon'?'⬡ icône':'🖼️ image';
      c.appendChild(ph);
    }
  }
  return c;
}
function buildStage(stage, card, interactive){
  stage.innerHTML='';
  const W=project.card.w, H=project.card.h;
  stage.style.width=W+'px'; stage.style.height=H+'px';
  stage.style.background=card.bgColor||'#fff';
  stage.style.borderRadius=(card.radius||0)+'px';
  // fond image
  if(card.bg){ const bg=document.createElement('div'); bg.className='bg'; bg.style.backgroundImage=`url(${card.bg})`; stage.appendChild(bg); }
  // modules triés par z
  card.modules.slice().sort((a,b)=>a.z-b.z).forEach(m=>{
    const el=document.createElement('div'); el.className='module'; el.dataset.id=m.id;
    styleModuleEl(el,m);
    el.appendChild(contentEl(m));
    if(m.locked){ el.classList.add('locked'); const b=document.createElement('div'); b.className='lockbadge'; b.textContent='🔒'; el.appendChild(b); }
    if(interactive && m.id===ui.sel){
      el.classList.add('selected');
      if(!m.locked) ['nw','ne','sw','se','n','s','e','w'].forEach(h=>{
        const hd=document.createElement('div'); hd.className='handle '+h; hd.dataset.h=h; el.appendChild(hd);
      });
    }
    if(interactive) attachModuleEvents(el,m);
    stage.appendChild(el);
  });
  // bordure de la carte (cadre)
  const cbw=card.borderW||0;
  if(cbw>0){ const fr=document.createElement('div'); fr.className='cardframe';
    fr.style.border=`${cbw}px solid ${card.borderColor||'#241c2e'}`; fr.style.borderRadius=(card.radius||0)+'px'; stage.appendChild(fr); }
  // guide de marge par-dessus
  if(interactive){
    const g=document.createElement('div'); g.className='margin-guide';
    const M=project.margin; g.style.left=M+'px'; g.style.top=M+'px'; g.style.width=(W-2*M)+'px'; g.style.height=(H-2*M)+'px';
    stage.appendChild(g);
  }
}

/* =========================================================================
   INTERACTIONS : drag, resize, sélection, double-clic éditer
   ========================================================================= */
let drag=null;
function attachModuleEvents(el,m){
  el.addEventListener('pointerdown',e=>{
    if(e.target.classList.contains('handle')) return startResize(e,el,m);
    if(e.target.dataset && e.target.dataset.editing) return; // en édition texte
    // sélection SANS reconstruire le plateau (sinon l'élément déplacé est détruit)
    if(ui.sel!==m.id){
      ui.sel=m.id; renderRight();
      $('#stage').querySelectorAll('.module.selected').forEach(x=>{ x.classList.remove('selected'); x.querySelectorAll('.handle').forEach(h=>h.remove()); });
      el.classList.add('selected');
    }
    if(m.locked) return;
    startMove(e, el, m); // les poignées seront redessinées au relâchement (endDrag → refreshStage)
  });
  if(isText(m)){
    el.addEventListener('dblclick',e=>{
      if(m.locked) return;
      const t=el.querySelector('[data-text]'); if(!t) return;
      t.setAttribute('contenteditable','true'); t.dataset.editing='1'; t.style.cursor='text';
      t.focus();
      const r=document.createRange(); r.selectNodeContents(t); const s=getSelection(); s.removeAllRanges(); s.addRange(r);
      const stop=()=>{ m.text=t.innerText; t.removeAttribute('contenteditable'); delete t.dataset.editing;
        t.removeEventListener('blur',stop); save(); renderRight(); };
      t.addEventListener('blur',stop);
    });
  }
}
function stagePointer(e){
  const st=$('#stage').getBoundingClientRect();
  return { x:(e.clientX-st.left)/ui.zoom, y:(e.clientY-st.top)/ui.zoom };
}
const SNAP=6;
function showSnap(vert,pos){
  const stage=$('#stage'); const l=document.createElement('div'); l.className='snapline';
  if(vert){ l.style.left=pos+'px'; l.style.top=0; l.style.width='1px'; l.style.height=project.card.h+'px'; }
  else    { l.style.top=pos+'px'; l.style.left=0; l.style.height='1px'; l.style.width=project.card.w+'px'; }
  stage.appendChild(l);
}
function clearSnap(){ $('#stage').querySelectorAll('.snapline').forEach(n=>n.remove()); }

function startMove(e,el,m){
  el.setPointerCapture(e.pointerId);
  const p=stagePointer(e); drag={mode:'move',m,el,offx:p.x-m.x,offy:p.y-m.y};
  el.style.cursor='grabbing';
  el.addEventListener('pointermove',onMove); el.addEventListener('pointerup',endDrag);
}
function onMove(e){
  if(!drag||drag.mode!=='move') return;
  const p=stagePointer(e); const W=project.card.w,H=project.card.h,M=project.margin,m=drag.m;
  let nx=p.x-drag.offx, ny=p.y-drag.offy;
  clearSnap();
  // snap : marges + centres
  const snapsX=[M, W-M-m.w, (W-m.w)/2, 0, W-m.w];
  const snapsY=[M, H-M-m.h, (H-m.h)/2, 0, H-m.h];
  snapsX.forEach(s=>{ if(Math.abs(nx-s)<SNAP){ nx=s; showSnap(true, s===(W-m.w)/2?W/2:(s<=M?s:s+m.w)); } });
  snapsY.forEach(s=>{ if(Math.abs(ny-s)<SNAP){ ny=s; showSnap(false, s===(H-m.h)/2?H/2:(s<=M?s:s+m.h)); } });
  m.x=Math.round(nx); m.y=Math.round(ny);
  drag.el.style.left=m.x+'px'; drag.el.style.top=m.y+'px';
  syncPosFields(m);
}
function startResize(e,el,m){
  e.stopPropagation(); el.setPointerCapture(e.pointerId);
  drag={mode:'resize',m,el,h:e.target.dataset.h,ox:m.x,oy:m.y,ow:m.w,oh:m.h,start:stagePointer(e)};
  el.addEventListener('pointermove',onResize); el.addEventListener('pointerup',endDrag);
}
function onResize(e){
  if(!drag||drag.mode!=='resize') return;
  const p=stagePointer(e), m=drag.m, h=drag.h, MIN=24;
  let x=drag.ox,y=drag.oy,w=drag.ow,hh=drag.oh;
  const dx=p.x-drag.start.x, dy=p.y-drag.start.y;
  if(h.includes('e')) w=Math.max(MIN,drag.ow+dx);
  if(h.includes('s')) hh=Math.max(MIN,drag.oh+dy);
  if(h.includes('w')){ w=Math.max(MIN,drag.ow-dx); x=drag.ox+(drag.ow-w); }
  if(h.includes('n')){ hh=Math.max(MIN,drag.oh-dy); y=drag.oy+(drag.oh-hh); }
  Object.assign(m,{x:Math.round(x),y:Math.round(y),w:Math.round(w),h:Math.round(hh)});
  styleModuleEl(drag.el,m); syncPosFields(m);
}
function endDrag(e){
  if(!drag) return;
  clearSnap();
  drag.el.style.cursor=''; drag.el.removeEventListener('pointermove',onMove);
  drag.el.removeEventListener('pointermove',onResize); drag.el.removeEventListener('pointerup',endDrag);
  drag=null; save(); refreshStage();
}
function syncPosFields(m){
  ['x','y','w','h'].forEach(k=>{ const f=document.getElementById('f_'+k); if(f) f.value=Math[k=='w'||k=='h'?'round':'round'](m[k]); });
}

/* clic dans le vide = désélection */
function canvasClick(e){ if(e.target.id==='stage'||e.target.classList.contains('bg')||e.target.classList.contains('margin-guide')){ ui.sel=null; renderRight(); refreshStage(); } }

/* =========================================================================
   PANNEAU DROIT (propriétés du module)
   ========================================================================= */
function renderRight(){
  const p=$('#rightPanel'); const m=selectedModule();
  if(!m){ p.innerHTML=`<div class="empty-note">Sélectionne un module sur la carte pour éditer ses propriétés.<br><br>Double-clic sur un cadre texte pour écrire directement.</div>`; return; }
  const titles={title:'Cadre titre',icon:'Icône',image:'Cadre image',description:'Description'};
  let html=`<div class="sec"><h3>${titles[m.type]}</h3>
    <div class="toggle" style="margin-bottom:12px">
      <span class="hint">Verrouiller</span>
      <div class="switch ${m.locked?'on':''}" id="lockSw"><i></i></div>
    </div>
    <div class="row">
      <div class="field"><label>X</label><input type="number" id="f_x" value="${Math.round(m.x)}"></div>
      <div class="field"><label>Y</label><input type="number" id="f_y" value="${Math.round(m.y)}"></div>
    </div>
    <div class="row">
      <div class="field"><label>Largeur</label><input type="number" id="f_w" value="${Math.round(m.w)}"></div>
      <div class="field"><label>Hauteur</label><input type="number" id="f_h" value="${Math.round(m.h)}"></div>
    </div>
  </div>`;

  if(isText(m)){
    html+=`<div class="sec"><h3>Texte</h3>
      <div class="field"><textarea id="f_text">${escapeHtml(m.text)}</textarea></div>
      <div class="field"><label>Police</label><select id="f_font">${FONTS.map(f=>`<option value="${f[0]}" ${m.fontFamily===f[0]?'selected':''}>${f[1]}</option>`).join('')}</select></div>
      <div class="row">
        <div class="field"><label>Taille</label><input type="number" id="f_fs" value="${m.fontSize}"></div>
        <div class="field"><label>Couleur</label><input type="color" id="f_color" value="${m.color}"></div>
      </div>
      <div class="field"><label>Alignement</label>
        <div class="seg" id="f_align">
          <button data-v="left" class="${m.align==='left'?'on':''}">⯇</button>
          <button data-v="center" class="${m.align==='center'?'on':''}">≡</button>
          <button data-v="right" class="${m.align==='right'?'on':''}">⯈</button>
        </div>
      </div>
      <div class="field"><label>Position verticale</label>
        <div class="seg" id="f_valign">
          <button data-v="top" class="${m.valign==='top'?'on':''}">Haut</button>
          <button data-v="center" class="${m.valign==='center'?'on':''}">Centre</button>
          <button data-v="bottom" class="${m.valign==='bottom'?'on':''}">Bas</button>
        </div>
      </div>
      <div class="row">
        <div class="field"><label>Gras</label><div class="seg" id="f_bold"><button data-v="1" class="${m.bold?'on':''}">B</button><button data-v="0" class="${!m.bold?'on':''}">—</button></div></div>
        <div class="field"><label>Italique</label><div class="seg" id="f_ital"><button data-v="1" class="${m.italic?'on':''}"><i>I</i></button><button data-v="0" class="${!m.italic?'on':''}">—</button></div></div>
      </div>
      <div class="field"><label>Interligne : ${m.lineHeight}</label><input type="range" id="f_lh" min="0.9" max="2" step="0.05" value="${m.lineHeight}"></div>
    </div>`;
  } else {
    html+=`<div class="sec"><h3>Image</h3>
      <div class="field"><button class="btn filebtn" style="width:100%">Importer une image<input type="file" id="f_img" accept="image/*"></button></div>
      ${m.image?`<button class="btn ghost sm danger" id="f_imgClear" style="width:100%;margin-bottom:10px">Retirer l'image</button>`:''}
      <div class="field"><label>Ajustement</label>
        <div class="seg" id="f_fit"><button data-v="cover" class="${m.fit==='cover'?'on':''}">Remplir</button><button data-v="contain" class="${m.fit==='contain'?'on':''}">Contenir</button></div>
      </div>
    </div>`;
  }

  html+=`<div class="sec"><h3>Cadre</h3>
    <div class="field"><label>Couleur de fond</label>
      <div class="row">
        <input type="color" id="f_bg" value="${m.bg==='transparent'?'#ffffff':m.bg}">
        <button class="btn sm" id="f_bgClear">Transparent</button>
      </div>
    </div>
    <div class="row">
      <div class="field"><label>Bordure (px)</label><input type="number" id="f_bw" value="${m.borderW}" min="0"></div>
      <div class="field"><label>Couleur</label><input type="color" id="f_bc" value="${m.borderColor}"></div>
    </div>
    <div class="row">
      <div class="field"><label>Arrondi : ${m.radius}</label><input type="range" id="f_rad" min="0" max="120" value="${m.radius}"></div>
    </div>
    <div class="field"><label>Marge interne : ${m.padding}</label><input type="range" id="f_pad" min="0" max="60" value="${m.padding}"></div>
    <div class="field"><label>Opacité : ${Math.round(m.opacity*100)}%</label><input type="range" id="f_op" min="0.1" max="1" step="0.05" value="${m.opacity}"></div>
    <button class="btn ghost sm danger" id="delMod" style="width:100%;margin-top:6px">Supprimer le module</button>
  </div>`;
  p.innerHTML=html;
  wireRight(m);
}
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function wireRight(m){
  const upd=(patch)=>{ Object.assign(m,patch); save(); refreshStage(); };
  const updRe=(patch)=>{ Object.assign(m,patch); save(); refreshStage(); renderRight(); };
  $('#lockSw').onclick=()=>{ m.locked=!m.locked; if(m.locked&&ui.sel===m.id){} save(); refreshStage(); renderRight(); };
  ['x','y','w','h'].forEach(k=>{ const f=document.getElementById('f_'+k); f.oninput=()=>upd({[k]:parseFloat(f.value)||0}); });
  $('#delMod').onclick=()=>{ const c=currentCard(); c.modules=c.modules.filter(x=>x.id!==m.id); ui.sel=null; save(); refreshStage(); renderRight(); };

  if(isText(m)){
    $('#f_text').oninput=e=>upd({text:e.target.value});
    $('#f_font').onchange=e=>upd({fontFamily:e.target.value});
    $('#f_fs').oninput=e=>upd({fontSize:parseFloat(e.target.value)||12});
    $('#f_color').oninput=e=>upd({color:e.target.value});
    segWire('f_align',v=>upd({align:v}));
    segWire('f_valign',v=>upd({valign:v}));
    segWire('f_bold',v=>upd({bold:v==='1'}));
    segWire('f_ital',v=>upd({italic:v==='1'}));
    $('#f_lh').oninput=e=>updRe({lineHeight:parseFloat(e.target.value)});
  } else {
    $('#f_img').onchange=e=>readImage(e.target.files[0],d=>updRe({image:d}));
    if($('#f_imgClear')) $('#f_imgClear').onclick=()=>updRe({image:null});

/* =========================================================================
   VUE PROJET — paquets en piles battues
   ========================================================================= */
const ICONS={
  plus:`<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>`,
  num:`<svg viewBox="0 0 24 24"><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>`,
  edit:`<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>`,
  copy:`<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>`,
  move:`<svg viewBox="0 0 24 24"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>`,
  del:`<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></svg>`
};
function hashRot(id){ let h=0; for(const ch of (id||'')) h=(h*31+ch.charCodeAt(0))>>>0;
  return { rot:((h%1000)/1000*10-5).toFixed(1), jit:(h>>4)%7 }; }
function cardsOfDeck(id){ return project.cards.filter(c=>c.deckId===id)
  .sort((a,b)=>((a.pileNo??1e9)-(b.pileNo??1e9)) || (project.cards.indexOf(a)-project.cards.indexOf(b))); }

function renderProject(){
  $('#cardCount').textContent = `${project.cards.length} carte(s) · ${project.decks.length} paquet(s)`;
  const cont=$('#decksContainer'); cont.innerHTML='';
  const thumbW=120, thumbH=Math.round(thumbW*project.card.h/project.card.w), STEP=42;

  const rows=project.decks.map(d=>({deck:d, cards:cardsOfDeck(d.id)}));
  const loose=project.cards.filter(c=>!c.deckId||!project.decks.some(d=>d.id===c.deckId));
  if(loose.length) rows.push({deck:null, cards:loose});
  if(!rows.length){ cont.innerHTML=`<div class="empty-note">Aucune carte. Ajoute une carte ou crée un paquet.</div>`; return; }

  rows.forEach(row=>{
    const d=row.deck;
    const rowEl=document.createElement('div'); rowEl.className='deck-row'+(d?'':' loose');
    const head=document.createElement('div'); head.className='deck-row-head';
    head.innerHTML =
      `<span class="dot" style="background:${d?d.color:'#6b6b6b'}"></span>`+
      `<span class="dname">${d?escapeHtml(d.name):'Hors paquet'}</span>`+
      `<span class="dcount">${row.cards.length} carte(s)</span>`+
      `<span class="grow"></span>`+
      `<button class="ic" data-a="add" title="Ajouter une carte">${ICONS.plus}</button>`+
      (d?`<button class="ic" data-a="copy" title="Copier le paquet">${ICONS.copy}</button>
          <button class="ic" data-a="edit" title="Éditer le paquet">${ICONS.edit}</button>
          <button class="ic" data-a="del" title="Supprimer le paquet">${ICONS.del}</button>`:'');
    rowEl.appendChild(head);
    head.querySelector('[data-a=add]').onclick=()=>newCardInDeck(d?d.id:null);
    if(d){
      head.querySelector('[data-a=copy]').onclick=()=>duplicateDeck(d.id);
      head.querySelector('[data-a=edit]').onclick=()=>openDeckModal(d.id);
      head.querySelector('[data-a=del]').onclick=()=>askConfirm(`Supprimer le paquet « ${d.name} » ? Les cartes repasseront « hors paquet ».`, ()=>delDeck(d.id));
    }

    const scroll=document.createElement('div'); scroll.className='pile-scroll';
    const pile=document.createElement('div'); pile.className='pile';
    const hasDos = !!(d && d.back);
    const off = hasDos ? 1 : 0;                 // décalage : le dos ouvre la pile
    const total = row.cards.length + off;
    if(total===0){ pile.classList.add('empty'); pile.textContent='Aucune carte — clique sur ＋ pour en ajouter.'; }
    else pile.style.height=(thumbH+96)+'px';

    if(hasDos){
      const {rot,jit}=hashRot('dos-'+d.id);
      const pc=document.createElement('div'); pc.className='pile-card dos-card';
      pc.style.left='0px'; const baseZ=1; pc.style.zIndex=baseZ;
      pc.style.setProperty('--rot',rot+'deg'); pc.style.setProperty('--jit',jit+'px');
      pc.addEventListener('mouseenter',()=>pc.style.zIndex=9999);
      pc.addEventListener('mouseleave',()=>pc.style.zIndex=baseZ);
      const art=document.createElement('div'); art.className='art'; art.style.width=thumbW+'px'; art.style.height=thumbH+'px';
      art.style.backgroundImage=`url(${d.back})`; art.style.backgroundSize='cover'; art.style.backgroundPosition='center';
      pc.appendChild(art);
      const nm=document.createElement('div'); nm.className='pile-name'; nm.textContent='Dos du paquet'; pc.appendChild(nm);
      pile.appendChild(pc);
    }

    row.cards.forEach((c,i)=>{
      const idx=i+off;
      const {rot,jit}=hashRot(c.id);
      const pc=document.createElement('div'); pc.className='pile-card';
      pc.style.left=(idx*STEP)+'px'; const baseZ=idx+1; pc.style.zIndex=baseZ;
      pc.style.setProperty('--rot',rot+'deg'); pc.style.setProperty('--jit',jit+'px');
      pc.addEventListener('mouseenter',()=>pc.style.zIndex=9999);
      pc.addEventListener('mouseleave',()=>pc.style.zIndex=baseZ);

      const art=document.createElement('div'); art.className='art'; art.style.width=thumbW+'px'; art.style.height=thumbH+'px';
      const inner=document.createElement('div'); inner.className='stage'; art.appendChild(inner);
      buildStage(inner,c,false); inner.style.transform=`scale(${thumbW/project.card.w})`;
      pc.appendChild(art);

      if(c.pileNo!=null){ const no=document.createElement('div'); no.className='pile-no'; no.textContent=c.pileNo; pc.appendChild(no); }
      const nm=document.createElement('div'); nm.className='pile-name'; nm.textContent=c.name; pc.appendChild(nm);

      const tools=document.createElement('div'); tools.className='card-tools';
      tools.innerHTML=
        `<button data-t="num" title="Numéroter (ordre dans la pile)">${ICONS.num}</button>`+
        `<button data-t="edit" title="Modifier le recto">${ICONS.edit}</button>`+
        `<button data-t="copy" title="Copier la carte">${ICONS.copy}</button>`+
        `<button data-t="move" title="Déplacer vers un paquet">${ICONS.move}</button>`+
        `<button data-t="del" class="del" title="Supprimer">${ICONS.del}</button>`;
      tools.querySelector('[data-t=num]').onclick =e=>{ e.stopPropagation(); numberCard(c); };
      tools.querySelector('[data-t=edit]').onclick=e=>{ e.stopPropagation(); openCardRecto(c.id); };
      tools.querySelector('[data-t=copy]').onclick=e=>{ e.stopPropagation(); duplicateCard(c.id); };
      tools.querySelector('[data-t=move]').onclick=e=>{ e.stopPropagation(); showMoveMenu(c,e.currentTarget); };
      tools.querySelector('[data-t=del]').onclick =e=>{ e.stopPropagation(); askConfirm('Supprimer cette carte ?', ()=>deleteCard(c.id)); };
      pc.appendChild(tools);

      art.onclick=()=>openCardRecto(c.id);
      pile.appendChild(pc);
    });

    if(total) pile.style.width=((total-1)*STEP+thumbW+10)+'px';
    scroll.appendChild(pile); rowEl.appendChild(scroll); cont.appendChild(rowEl);
  });
}

function duplicateDeck(id){
  const src=project.decks.find(d=>d.id===id); if(!src) return;
  const nd={ id:uid(), name:src.name+' (copie)', color:src.color, back:src.back||null };
  const idx=project.decks.indexOf(src); project.decks.splice(idx+1,0,nd);
  // copie des cartes du paquet, dans l'ordre de la pile
  cardsOfDeck(id).forEach(c=>{
    const copy=JSON.parse(JSON.stringify(c));
    copy.id=uid(); copy.deckId=nd.id; copy.modules.forEach(m=>m.id=uid());
    project.cards.push(copy);
  });
  save(); renderProject(); toast(`Paquet « ${src.name} » copié`);
}

/* Export PNG haute résolution (rendu canvas maison, sans dépendance) */
const EXPORT_SCALE=3;
function exportPNG(){
  const c=currentCard(); const side = (isEditing()&&ui.editSide==='verso') ? 'verso' : 'recto';
  renderCardToCanvas(c, side, EXPORT_SCALE, canvas=>{
    canvas.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b);
      a.download=(c.name||'carte').replace(/[^\w\-]+/g,'_')+'_'+side+'.png'; a.click(); toast('PNG exporté'); });
  });
}
function loadImg(src){ return new Promise(res=>{ if(!src) return res(null); const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; }); }
async function renderCardToCanvas(card, side, scale, done){
  const W=project.card.w, H=project.card.h;
  const cv=document.createElement('canvas'); cv.width=W*scale; cv.height=H*scale;
  const ctx=cv.getContext('2d'); ctx.scale(scale,scale);
  const rad=card.radius||0;
  // découpe arrondie de la carte (coins transparents)
  ctx.save(); roundRect(ctx,0,0,W,H,rad); ctx.clip();
  ctx.fillStyle=card.bgColor||'#fff'; ctx.fillRect(0,0,W,H);

  if(side==='verso'){
    const img=cardBack(card);
    const im=await loadImg(img); if(im) drawCover(ctx,im,0,0,W,H);
    ctx.restore();
    strokeCardBorder(ctx,card,W,H,rad);
    return done(cv);
  }
  const bg=await loadImg(card.bg); if(bg) drawCover(ctx,bg,0,0,W,H);
  const mods=card.modules.slice().sort((a,b)=>a.z-b.z);
  for(const m of mods){
    ctx.save(); ctx.globalAlpha=m.opacity;
    roundRect(ctx,m.x,m.y,m.w,m.h,m.radius);
    if(m.bg!=='transparent'){ ctx.fillStyle=m.bg; ctx.fill(); }
    if(m.borderW>0){ ctx.lineWidth=m.borderW; ctx.strokeStyle=m.borderColor; ctx.stroke(); }
    ctx.clip();
    const px=m.x+m.padding, py=m.y+m.padding, pw=m.w-2*m.padding, ph=m.h-2*m.padding;
    if(isText(m)){
      drawText(ctx,m,px,py,pw,ph);
    } else if(m.image){
      const im=await loadImg(m.image);
      if(im){ if(m.fit==='contain') drawContain(ctx,im,px,py,pw,ph); else drawCover(ctx,im,px,py,pw,ph); }
    }
    ctx.restore();
  }
  ctx.restore();
  strokeCardBorder(ctx,card,W,H,rad);
  done(cv);
}
function strokeCardBorder(ctx,card,W,H,rad){
  const cbw=card.borderW||0; if(cbw<=0) return;
  ctx.lineWidth=cbw; ctx.strokeStyle=card.borderColor||'#241c2e';
  roundRect(ctx, cbw/2, cbw/2, W-cbw, H-cbw, Math.max(0, rad-cbw/2)); ctx.stroke();
}

/* =========================================================================
   IMPRESSION — planches PDF / PNG (mise en page des cartes à leur taille réelle)
   ========================================================================= */
const PX_PER_MM=8;                 // px logiques d'une carte par mm
function renderCard(card,side,scale){ return new Promise(res=>renderCardToCanvas(card,side,scale,res)); }
function printLayout(){
  ensurePrint(); const P=project.print; const pg=pageDims();
  const cwmm=project.card.w/PX_PER_MM, chmm=project.card.h/PX_PER_MM;
  const cols=Math.max(1,Math.floor((pg.w-2*P.pageMargin+P.gap)/(cwmm+P.gap)));
  const rows=Math.max(1,Math.floor((pg.h-2*P.pageMargin+P.gap)/(chmm+P.gap)));
  return { pg, cwmm, chmm, cols, rows, per:Math.max(1,cols*rows) };
}
function updatePrintInfo(){
  const L=printLayout(); const n=project.cards.length; const pages=Math.max(1,Math.ceil(n/L.per));
  $('#printInfo').textContent=`${n} carte(s) · ${L.cols}×${L.rows} = ${L.per} par page · ${pages} page(s).`;
}
async function buildPrintPages(){
  const cards=project.cards; if(!cards.length){ toast('Aucune carte à imprimer'); return null; }
  const L=printLayout(); const P=project.print; const DPMM=12, scale=DPMM/PX_PER_MM;
  const canvases=[]; for(const c of cards) canvases.push(await renderCard(c,'recto',scale));
  const pages=[]; const totalPages=Math.ceil(cards.length/L.per);
  for(let p=0;p<totalPages;p++){
    const cv=document.createElement('canvas'); cv.width=Math.round(L.pg.w*DPMM); cv.height=Math.round(L.pg.h*DPMM);
    const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
    for(let s=0;s<L.per;s++){ const gi=p*L.per+s; if(gi>=cards.length) break;
      const col=s%L.cols, row=Math.floor(s/L.cols);
      const x=(P.pageMargin+col*(L.cwmm+P.gap))*DPMM, y=(P.pageMargin+row*(L.chmm+P.gap))*DPMM;
      const w=L.cwmm*DPMM, h=L.chmm*DPMM;
      ctx.drawImage(canvases[gi],x,y,w,h);
      if(P.cropMarks) drawCropMarks(ctx,x,y,w,h,DPMM);
    }
    pages.push(cv);
  }
  return pages;
}
function drawCropMarks(ctx,x,y,w,h,DPMM){
  const Ln=4*DPMM, O=1.2*DPMM; ctx.strokeStyle='#000'; ctx.lineWidth=Math.max(1,DPMM*0.12);
  [[x,y,-1,-1],[x+w,y,1,-1],[x,y+h,-1,1],[x+w,y+h,1,1]].forEach(([cx,cy,sx,sy])=>{
    ctx.beginPath(); ctx.moveTo(cx+sx*O,cy); ctx.lineTo(cx+sx*(O+Ln),cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,cy+sy*O); ctx.lineTo(cx,cy+sy*(O+Ln)); ctx.stroke();
  });
}
async function printPNG(){
  const pages=await buildPrintPages(); if(!pages) return;
  const base=(project.name||'projet').replace(/[^\w\-]+/g,'_');
  pages.forEach((cv,i)=>cv.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download=pages.length>1?`${base}_planche_${i+1}.png`:`${base}_planche.png`; a.click(); }));
  toast(pages.length>1?`${pages.length} planches PNG exportées`:'Planche PNG exportée');
}
async function printPDF(){
  if(!(window.jspdf && window.jspdf.jsPDF)){ toast('Export PDF indisponible (jsPDF non chargé — hors ligne ?)'); return; }
  const pages=await buildPrintPages(); if(!pages) return;
  const P=project.print; const pg=pageDims(); const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({unit:'mm', format:P.pageFormat==='Letter'?'letter':'a4', orientation:P.orient});
  pages.forEach((cv,i)=>{ if(i>0) pdf.addPage(); pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,pg.w,pg.h); });
  pdf.save(`${(project.name||'projet').replace(/[^\w\-]+/g,'_')}_impression.pdf`);
  toast('PDF généré');
}
function openPrintModal(){
  ensurePrint(); const P=project.print;
  $('#pgFormat').value=P.pageFormat; $('#pgOrient').value=P.orient;
  $('#pgMargin').value=P.pageMargin; $('#pgMarginV').textContent=P.pageMargin;
  $('#pgGap').value=P.gap; $('#pgGapV').textContent=P.gap;
  $('#cropSw').classList.toggle('on',!!P.cropMarks);
  $('#margin').value=project.margin; $('#marginVal').textContent=project.margin;
  ui.ppPage=1;
  $('#printModal').classList.add('show');
  requestAnimationFrame(()=>{ updatePrintInfo(); renderPrintPreview(); });
}
function printChanged(){ save(); updatePrintInfo(); renderPrintPreview(); }
function addCropDivs(page,x,y,w,h,sc){
  const Ln=4*sc, O=1.2*sc, T=1;
  const seg=(l,t,ww,hh)=>{ const d=document.createElement('div'); d.className='pp-crop';
    d.style.left=l+'px'; d.style.top=t+'px'; d.style.width=ww+'px'; d.style.height=hh+'px'; page.appendChild(d); };
  [[x,y,-1,-1],[x+w,y,1,-1],[x,y+h,-1,1],[x+w,y+h,1,1]].forEach(([cx,cy,sx,sy])=>{
    seg(sx<0?cx-O-Ln:cx+O, cy-T/2, Ln, T);
    seg(cx-T/2, sy<0?cy-O-Ln:cy+O, T, Ln);
  });
}
function renderPrintPreview(){
  const host=$('#printPreview'); if(!host) return; host.innerHTML='';
  const cards=project.cards; const L=printLayout(); const P=project.print;
  const pages=Math.max(1,Math.ceil(cards.length/L.per));
  ui.ppPage=Math.min(Math.max(1,ui.ppPage||1),pages);
  $('#ppPage').textContent=ui.ppPage; $('#ppCount').textContent=pages;
  if(!cards.length){ host.innerHTML='<div class="empty-note">Aucune carte à imprimer.</div>'; return; }
  const avW=host.clientWidth-28, avH=host.clientHeight-28;
  const sc=Math.max(0.2, Math.min(avW/L.pg.w, avH/L.pg.h));  // px par mm (aperçu)
  const page=document.createElement('div'); page.className='pp-page';
  page.style.width=(L.pg.w*sc)+'px'; page.style.height=(L.pg.h*sc)+'px';
  const start=(ui.ppPage-1)*L.per;
  for(let s=0;s<L.per;s++){ const gi=start+s; if(gi>=cards.length) break;
    const c=cards[gi], col=s%L.cols, row=Math.floor(s/L.cols);
    const xmm=P.pageMargin+col*(L.cwmm+P.gap), ymm=P.pageMargin+row*(L.chmm+P.gap);
    const el=document.createElement('div'); el.className='pp-card';
    el.style.left=(xmm*sc)+'px'; el.style.top=(ymm*sc)+'px';
    el.style.width=(L.cwmm*sc)+'px'; el.style.height=(L.chmm*sc)+'px';
    const inner=document.createElement('div'); inner.className='stage'; el.appendChild(inner);
    buildStage(inner,c,false); inner.style.transform=`scale(${(L.cwmm*sc)/project.card.w})`;
    page.appendChild(el);
    if(P.cropMarks) addCropDivs(page, xmm*sc, ymm*sc, L.cwmm*sc, L.chmm*sc, sc);
  }
  host.appendChild(page);
}

function roundRect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawCover(ctx,im,x,y,w,h){ const r=Math.max(w/im.width,h/im.height); const iw=im.width*r,ih=im.height*r;
  ctx.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih); }
function drawContain(ctx,im,x,y,w,h){ const r=Math.min(w/im.width,h/im.height); const iw=im.width*r,ih=im.height*r;
  ctx.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih); }
function drawText(ctx,m,x,y,w,h){
  ctx.fillStyle=m.color; ctx.textBaseline='top';
  ctx.font=`${m.italic?'italic ':''}${m.bold?'700':'400'} ${m.fontSize}px ${m.fontFamily}`;
  const lh=m.fontSize*m.lineHeight;
  // découpe en lignes (respecte \n + wrap)
  const lines=[];
  m.text.split('\n').forEach(par=>{
    const words=par.split(' '); let cur='';
    words.forEach(wd=>{ const test=cur?cur+' '+wd:wd;
      if(ctx.measureText(test).width>w && cur){ lines.push(cur); cur=wd; } else cur=test; });
    lines.push(cur);
  });
  const total=lines.length*lh;
  let sy = m.valign==='center'? y+(h-total)/2 : m.valign==='bottom'? y+h-total : y;
  ctx.textAlign = m.align;
  const tx = m.align==='center'? x+w/2 : m.align==='right'? x+w : x;
  lines.forEach((ln,i)=>ctx.fillText(ln,tx,sy+i*lh));
}

/* =========================================================================
   PERSISTANCE localStorage
   ========================================================================= */
const LS='carteforge_v1';
function save(){ try{ localStorage.setItem(LS,JSON.stringify(project)); }catch(e){} }
function restore(){ try{ const s=localStorage.getItem(LS); if(s){ const o=JSON.parse(s); if(o&&o.cards){ project=o; ui.cardId=o.cards[0].id; return true; } } }catch(e){} return false; }

/* =========================================================================
   NAVIGATION — projet (base) + overlay d'édition
   ========================================================================= */
function openEditor(id, side){
  ui.cardId=id; ui.sel=null;
  $('#editor').classList.add('show');
  refreshCardSelectors(); syncLeftPanel();
  setEditSide(side||'recto');
}
function syncLeftPanel(){
  const c=currentCard();
  const bg=$('#bgColor'); if(bg) bg.value=c.bgColor||'#ffffff';
  const bw=$('#cardBorderW'); if(bw){ bw.value=c.borderW||0; $('#cbW').textContent=c.borderW||0; }
  const bc=$('#cardBorderColor'); if(bc) bc.value=c.borderColor||'#241c2e';
  const br=$('#cardRadius'); if(br){ br.value=c.radius||0; $('#cbR').textContent=c.radius||0; }
}
function closeEditor(){ $('#editor').classList.remove('show'); closeFloat(); renderProject(); }
function setEditSide(side){
  ui.editSide=side;
  document.querySelectorAll('.ed-side button').forEach(b=>b.classList.toggle('on',b.dataset.side===side));
  document.querySelector('.ed-panel.recto').classList.toggle('active',side==='recto');
  document.querySelector('.ed-panel.verso').classList.toggle('active',side==='verso');
  $('#layerctl').classList.toggle('hide',side!=='recto');
  if(side==='recto'){ refreshStage(); renderRight(); fitZoom(); }
  else refreshVerso();
}
function hydrate(){
  $('#projName').value=project.name;
  $('#cardSize').value=project.card.w+'x'+project.card.h;
  ensurePrint();
  $('#margin').value=project.margin; $('#marginVal').textContent=project.margin;
  refreshCardSelectors();
  renderProject();
}

/* =========================================================================
   BRANCHEMENTS UI
   ========================================================================= */
function bind(){
  $('#projName').oninput=e=>{ project.name=e.target.value; save(); };
  // navigation overlay
  $('#edBack').onclick=closeEditor;
  document.querySelectorAll('.ed-side button').forEach(b=>b.onclick=()=>setEditSide(b.dataset.side));
  // ajout modules
  document.querySelectorAll('.add').forEach(b=>b.onclick=()=>{
    const m=makeModule(b.dataset.add); currentCard().modules.push(m); ui.sel=m.id; save(); refreshStage(); renderRight();
  });
  // fond de la carte
  $('#bgFile').onchange=e=>readImage(e.target.files[0],d=>{ currentCard().bg=d; save(); refreshStage(); });
  $('#clearBg').onclick=()=>{ currentCard().bg=null; save(); refreshStage(); };
  $('#bgColor').oninput=e=>{ currentCard().bgColor=e.target.value; save(); refreshStage(); };
  // bordure de la carte
  $('#cardBorderW').oninput=e=>{ currentCard().borderW=+e.target.value; $('#cbW').textContent=e.target.value; save(); refreshStage(); };
  $('#cardBorderColor').oninput=e=>{ currentCard().borderColor=e.target.value; save(); refreshStage(); };
  $('#cardRadius').oninput=e=>{ currentCard().radius=+e.target.value; $('#cbR').textContent=e.target.value; save(); refreshStage(); };
  // format
  $('#cardSize').onchange=e=>{ const [w,h]=e.target.value.split('x').map(Number); project.card={w,h}; save(); if(isEditing()){ refreshStage(); fitZoom(); } };
  // marge de sécurité (dans Impression)
  $('#margin').oninput=e=>{ project.margin=+e.target.value; $('#marginVal').textContent=e.target.value; save(); if(isEditing()) refreshStage(); updatePrintInfo(); };
  // calques (ordre des modules)
  $('#layerUp').onclick=()=>{ const m=selectedModule(); if(!m){ toast('Sélectionne un module'); return; } m.z=Math.max(...currentCard().modules.map(x=>x.z))+1; save(); refreshStage(); };
  $('#layerDown').onclick=()=>{ const m=selectedModule(); if(!m){ toast('Sélectionne un module'); return; } m.z=Math.min(...currentCard().modules.map(x=>x.z))-1; save(); refreshStage(); };
  // zoom à la molette (Ctrl/Cmd + molette) — sans bouton
  $('#canvas').addEventListener('wheel',e=>{ if(!(e.ctrlKey||e.metaKey)) return; e.preventDefault(); ui.zoom=clamp(ui.zoom*(e.deltaY<0?1.1:0.9),.15,3); applyZoom(); }, {passive:false});
  // cartes / projet
  $('#btnNewCard2').onclick=newCard;
  $('#btnNewDeck').onclick=()=>openDeckModal(null);
  $('#cardName').oninput=e=>{ currentCard().name=e.target.value; save(); };
  // impression
  $('#printBtn').onclick=openPrintModal;
  $('#printCancel').onclick=()=>$('#printModal').classList.remove('show');
  $('#pgFormat').onchange=e=>{ ensurePrint(); project.print.pageFormat=e.target.value; ui.ppPage=1; printChanged(); };
  $('#pgOrient').onchange=e=>{ ensurePrint(); project.print.orient=e.target.value; ui.ppPage=1; printChanged(); };
  $('#pgMargin').oninput=e=>{ ensurePrint(); project.print.pageMargin=+e.target.value; $('#pgMarginV').textContent=e.target.value; printChanged(); };
  $('#pgGap').oninput=e=>{ ensurePrint(); project.print.gap=+e.target.value; $('#pgGapV').textContent=e.target.value; printChanged(); };
  $('#cropSw').onclick=()=>{ ensurePrint(); project.print.cropMarks=!project.print.cropMarks; $('#cropSw').classList.toggle('on',project.print.cropMarks); printChanged(); };
  $('#ppPrev').onclick=()=>{ ui.ppPage=(ui.ppPage||1)-1; renderPrintPreview(); };
  $('#ppNext').onclick=()=>{ ui.ppPage=(ui.ppPage||1)+1; renderPrintPreview(); };
  $('#printPNG').onclick=printPNG;
  $('#printPDF').onclick=printPDF;
  // menu ⛯ (fichiers + installation)
  const gm=$('#gearMenu');
  $('#gearBtn').onclick=e=>{ e.stopPropagation(); gm.classList.toggle('show'); };
  document.addEventListener('click',e=>{ if(!e.target.closest('.menu-wrap')) gm.classList.remove('show'); });
  $('#mSave').onclick=()=>{ gm.classList.remove('show'); saveJson(); };
  $('#mOpen').onclick=()=>{ gm.classList.remove('show'); $('#loadJson').click(); };
  $('#mPng').onclick=()=>{ gm.classList.remove('show'); exportPNG(); };
  $('#mInstall').onclick=()=>{ gm.classList.remove('show'); installApp(); };
  $('#loadJson').onchange=e=>{ if(e.target.files[0]) loadJsonFile(e.target.files[0]); e.target.value=''; };
  // canvas : clic vide
  $('#stage').addEventListener('pointerdown',canvasClick);
  // modal paquet
  $('#deckCancel').onclick=()=>{ ui.deckDos=null; $('#deckModal').classList.remove('show'); };
  $('#deckDosFile').onchange=e=>readImage(e.target.files[0],d=>{ ui.deckDos=d; setDosPreview(d); e.target.value=''; });
  $('#deckDosClear').onclick=()=>{ ui.deckDos=null; setDosPreview(null); };
  $('#deckSave').onclick=()=>{
    const name=$('#deckNameInput').value.trim()||'Paquet'; const color=$('#deckColorInput').value; const back=ui.deckDos||null;
    if(ui.editingDeck){ const d=project.decks.find(x=>x.id===ui.editingDeck); d.name=name; d.color=color; d.back=back; }
    else project.decks.push({id:uid(),name,color,back});
    ui.deckDos=null; $('#deckModal').classList.remove('show'); save(); renderProject();
    if(isEditing() && ui.editSide==='verso') refreshVerso();
  };
  // fenêtres maison (ask)
  $('#askOk').onclick=()=>askClose(true);
  $('#askCancel').onclick=()=>askClose(false);
  $('#askInput').addEventListener('keydown',e=>{ if(e.key==='Enter') askClose(true); if(e.key==='Escape') askClose(false); });
  // clavier : suppr + flèches (seulement en édition recto)
  document.addEventListener('keydown',e=>{
    if(!isEditing() || ui.editSide!=='recto') return; const m=selectedModule(); if(!m||m.locked) return;
    const tag=document.activeElement.tagName; if(tag==='INPUT'||tag==='TEXTAREA'||document.activeElement.isContentEditable) return;
    if(e.key==='Delete'||e.key==='Backspace'){ currentCard().modules=currentCard().modules.filter(x=>x.id!==m.id); ui.sel=null; save(); refreshStage(); renderRight(); e.preventDefault(); }
    const step=e.shiftKey?10:1;
    if(e.key==='ArrowLeft'){ m.x-=step; refreshStage(); renderRight(); e.preventDefault(); }
    if(e.key==='ArrowRight'){ m.x+=step; refreshStage(); renderRight(); e.preventDefault(); }
    if(e.key==='ArrowUp'){ m.y-=step; refreshStage(); renderRight(); e.preventDefault(); }
    if(e.key==='ArrowDown'){ m.y+=step; refreshStage(); renderRight(); e.preventDefault(); }
  });
  window.addEventListener('resize',()=>{ if(isEditing()){ if(ui.editSide==='recto') fitZoom(); else refreshVerso(); } });
}

let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

/* =========================================================================
   FAVICON 🎴 + INSTALLATION (PWA)
   ========================================================================= */
let deferredPrompt=null;
function setupFaviconAndManifest(){
  // favicon en SVG (emoji 🎴 sur fond prune)
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#241c2e"/><text x="32" y="35" font-size="42" text-anchor="middle" dominant-baseline="central">🎴</text></svg>`;
  const link=document.createElement('link'); link.rel='icon';
  link.href='data:image/svg+xml,'+encodeURIComponent(svg); document.head.appendChild(link);
  // icônes PNG générées depuis l'emoji pour le manifeste
  const mkIcon=px=>{ const c=document.createElement('canvas'); c.width=c.height=px; const x=c.getContext('2d');
    x.fillStyle='#241c2e'; roundRect(x,0,0,px,px,px*0.22); x.fill();
    x.font=`${Math.round(px*0.6)}px serif`; x.textAlign='center'; x.textBaseline='middle';
    x.fillText('🎴',px/2,px*0.56); return c.toDataURL('image/png'); };
  const manifest={ name:'Carte Forge', short_name:'Carte Forge', description:'Atelier de création de cartes de jeu',
    start_url:'.', scope:'.', display:'standalone', background_color:'#241c2e', theme_color:'#241c2e',
    icons:[{src:mkIcon(192),sizes:'192x192',type:'image/png',purpose:'any'},
           {src:mkIcon(512),sizes:'512x512',type:'image/png',purpose:'any maskable'}] };
  try{ const m=document.createElement('link'); m.rel='manifest';
    m.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
    document.head.appendChild(m); }catch(e){}
}
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; });
window.addEventListener('appinstalled',()=>{ deferredPrompt=null; toast('Application installée 🎴'); });
async function installApp(){
  if(deferredPrompt){ deferredPrompt.prompt(); const {outcome}=await deferredPrompt.userChoice;
    deferredPrompt=null; toast(outcome==='accepted'?'Installation lancée 🎴':'Installation annulée'); return; }
  if(window.matchMedia('(display-mode: standalone)').matches){ toast('Application déjà installée ✓'); return; }
  toast("Installe via le menu du navigateur → « Installer l'application » / « Ajouter à l'écran d'accueil »");
}

/* ---------- Démarrage ---------- */
(function init(){
  if(!restore()) newProject();
  setupFaviconAndManifest();
  bind(); hydrate(); fitZoom();
})();
</script>
